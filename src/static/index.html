<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة المصنع — Garment ERP</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Login screen -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <h1 class="brand">🧵 <span data-i18n="app_title">نظام إدارة مصنع الملابس</span></h1>
      <p class="muted" data-i18n="login_hint">سجّل الدخول عبر تيليجرام للمتابعة</p>
      <div id="tg-login-container"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- App shell -->
  <div id="shell" class="shell hidden">
    <div id="nav-overlay" class="nav-overlay hidden"></div>
    <aside class="sidebar">
      <div class="logo">🧵 <span data-i18n="app_short">المصنع</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <button id="lang-toggle" class="btn-ghost"></button>
        <button id="logout" class="btn-ghost" data-i18n="logout">خروج</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="topbar-start">
          <button id="nav-toggle" class="nav-toggle" aria-label="menu">☰</button>
          <div id="crumb" class="crumb"></div>
        </div>
        <div id="whoami" class="whoami"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="./app.js"></script>
</body>
</html>
