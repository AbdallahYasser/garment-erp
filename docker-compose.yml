services:
  garment-erp:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - coolify
    volumes:
      # Coolify-managed named volume holds the ERP's own SQLite DB + uploads.
      # This app is the sole owner/writer of the database (WAL mode).
      - garment-erp-data:/app/data

volumes:
  garment-erp-data:

networks:
  coolify:
    external: true
    name: coolify
